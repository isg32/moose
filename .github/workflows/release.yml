name: Build and release

# Builds signed APKs (one per ABI) on every push to main and publishes them
# as a GitHub release tagged v<version>-<short sha>.
#
# No keystore is committed. It comes from the MOOSE_KEYSTORE_BASE64
# secret (`base64 -w0 release-key.jks`), is decoded into the runner's temp
# folder for the build, and android/app/build.gradle.kts reads it through
# the MOOSE_* variables.
#
# Secrets (in the "deployment" environment): MOOSE_KEYSTORE_BASE64,
# MOOSE_KEYSTORE_PASSWORD, MOOSE_KEY_PASSWORD, MOOSE_API_URL and
# MOOSE_AUTH_URL; optionally MOOSE_KEY_ALIAS (defaults to "upload") and
# MOOSE_KLIPY_KEY (better GIF search).

on:
  push:
    branches:
      - main

permissions:
  contents: write

# A newer push replaces a build still running for an older one.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: deployment
    # A stuck build fails in time instead of holding the runner for hours.
    timeout-minutes: 45
    steps:
      # The whole history and tags: the update's notes list the commits since
      # the last release.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      # Gradle comes from GitHub's file host, which sometimes times out:
      # keep it (and the dependency cache) between runs.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          {
            echo 'MESSAGE<<EOM'
            git log -1 --format='%s'
            echo 'EOM'
          } >> "$GITHUB_OUTPUT"

      - name: Decode the release keystore
        env:
          MOOSE_KEYSTORE_BASE64: ${{ secrets.MOOSE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MOOSE_KEYSTORE_BASE64" ]; then
            echo "MOOSE_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          printf '%s' "$MOOSE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-key.jks"

      - run: flutter pub get

      - name: Test
        run: flutter test

      # The backend URLs (and KLIPY key) for --dart-define-from-file. jq
      # writes the JSON, so a value with a quote can't break it.
      - name: Write env.json
        env:
          MOOSE_API_URL: ${{ secrets.MOOSE_API_URL }}
          MOOSE_AUTH_URL: ${{ secrets.MOOSE_AUTH_URL }}
          MOOSE_KLIPY_KEY: ${{ secrets.MOOSE_KLIPY_KEY }}
        run: |
          if [ -z "$MOOSE_API_URL" ] || [ -z "$MOOSE_AUTH_URL" ]; then
            echo "MOOSE_API_URL and MOOSE_AUTH_URL must be set" >&2
            exit 1
          fi
          jq -n \
            --arg api "$MOOSE_API_URL" \
            --arg auth "$MOOSE_AUTH_URL" \
            --arg klipy "$MOOSE_KLIPY_KEY" \
            '{MOOSE_API_URL: $api, MOOSE_AUTH_URL: $auth}
              + (if $klipy == "" then {} else {MOOSE_KLIPY_KEY: $klipy} end)' \
            > env.json

      # Gradle's own downloader tries one host once, and GitHub's file host
      # sometimes answers 504 for hours. aria2 fetches the same file from the
      # official host and two mirrors, retrying, and checks it against the
      # SHA-256 pinned in gradle-wrapper.properties (when there is one).
      - name: Fetch Gradle
        run: |
          sudo apt-get install -y -qq aria2 > /dev/null
          PROPS=android/gradle/wrapper/gradle-wrapper.properties
          URL=$(sed -n 's/^distributionUrl=//p' "$PROPS" | sed 's#\\:#:#')
          SUM=$(sed -n 's/^distributionSha256Sum=//p' "$PROPS")
          FILE=$(basename "$URL")
          VERSION=$(echo "$FILE" | sed -E 's/gradle-(.*)-(bin|all).zip/\1/')
          aria2c --max-tries=10 --retry-wait=15 --split=3 \
            ${SUM:+--checksum="sha-256=$SUM"} --dir="$RUNNER_TEMP" --out=gradle.zip \
            "$URL" \
            "https://mirrors.cloud.tencent.com/gradle/$FILE" \
            "https://mirrors.aliyun.com/gradle/distributions/v$VERSION/$FILE"
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\://$RUNNER_TEMP/gradle.zip#" "$PROPS"

      # The committed gradle.properties asks for an 8 GB heap and 4 GB of
      # metaspace; with R8 and the Kotlin daemon on top, that starves the
      # 16 GB runner until it drops off ("lost communication"). Smaller here.
      - name: Fit Gradle to the runner
        run: |
          sed -i 's#^org.gradle.jvmargs=.*#org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError#' android/gradle.properties
          echo 'kotlin.daemon.jvmargs=-Xmx1g' >> android/gradle.properties
          echo 'org.gradle.workers.max=2' >> android/gradle.properties

      - name: Build signed APKs
        env:
          MOOSE_KEYSTORE_FILE: ${{ runner.temp }}/release-key.jks
          MOOSE_KEYSTORE_PASSWORD: ${{ secrets.MOOSE_KEYSTORE_PASSWORD }}
          MOOSE_KEY_PASSWORD: ${{ secrets.MOOSE_KEY_PASSWORD }}
          MOOSE_KEY_ALIAS: ${{ secrets.MOOSE_KEY_ALIAS }}
        # Retried, since a download can time out on a cold cache.
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --split-per-abi --dart-define-from-file=env.json && exit 0
            echo "Build attempt $attempt failed; retrying in 30 s" >&2
            sleep 30
          done
          exit 1

      - name: Check the APKs are signed with the release key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -q "Android Debug"; then
            echo "Signed with the debug key" >&2
            exit 1
          fi

      # update.json is what Moose reads to update itself (lib/net/updater.dart):
      # each APK's URL, size, SHA-256 and versionCode (read from the APK, since
      # --split-per-abi adds 1000 × the ABI), and the commits since the last
      # release as "What's new".
      - name: Write the update manifest
        env:
          TAG: v${{ steps.version.outputs.VERSION }}-${{ steps.version.outputs.SHA }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPO: ${{ github.repository }}
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="-1"; fi
          git log --no-merges --format='%s' $RANGE > "$RUNNER_TEMP/notes.txt"
          python3 - "$AAPT2" <<'PY'
          import hashlib, json, os, re, subprocess, sys, datetime
          aapt2 = sys.argv[1]
          tag, version, repo = os.environ["TAG"], os.environ["VERSION"], os.environ["REPO"]
          out = "build/app/outputs/flutter-apk"
          apks = {}
          for abi in ("arm64-v8a", "armeabi-v7a", "x86_64"):
              name = f"app-{abi}-release.apk"
              path = f"{out}/{name}"
              badging = subprocess.run([aapt2, "dump", "badging", path],
                                       capture_output=True, text=True, check=True).stdout
              code = int(re.search(r"versionCode='(\d+)'", badging).group(1))
              sha = hashlib.sha256(open(path, "rb").read()).hexdigest()
              apks[abi] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "sha256": sha,
                  "size": os.path.getsize(path),
                  "versionCode": code,
              }
          notes = []
          for line in open(os.environ["RUNNER_TEMP"] + "/notes.txt"):
              line = re.sub(r"\s*\(\d+\.\d+\.\d+\)\s*$", "", line.strip())
              if line and line not in notes:
                  notes.append(line)
          manifest = {
              "version": version,
              "build": apks["arm64-v8a"]["versionCode"] % 1000,
              "published": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "notes": notes[:12],
              "apks": apks,
          }
          json.dump(manifest, open(f"{out}/update.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      # A release no phone can install (the version wasn't bumped) would sit
      # there as "latest" and offer nothing: stop instead.
      - name: Check the version went up
        env:
          REPO: ${{ github.repository }}
        run: |
          NEW=$(python3 -c "import json;print(json.load(open('build/app/outputs/flutter-apk/update.json'))['apks']['arm64-v8a']['versionCode'])")
          OLD=$(curl -fsSL "https://github.com/$REPO/releases/latest/download/update.json" 2>/dev/null \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['apks']['arm64-v8a']['versionCode'])" 2>/dev/null || echo 0)
          echo "versionCode $OLD -> $NEW"
          if [ "$NEW" -le "$OLD" ]; then
            echo "versionCode $NEW is not above the last release's $OLD: bump the version in pubspec.yaml" >&2
            exit 1
          fi

      - name: Remove the keystore and env.json
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.jks" env.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}-${{ steps.version.outputs.SHA }}
          name: Moose ${{ steps.version.outputs.VERSION }}
          make_latest: true
          prerelease: false
          draft: false
          body: |
            **Commit:** ${{ steps.version.outputs.SHA }} · ${{ steps.version.outputs.MESSAGE }}

            For most phones: `app-arm64-v8a-release.apk`.
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/update.json
