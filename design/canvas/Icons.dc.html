<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moose icons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@500;700;900&amp;family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;background:#ecebe7;font-family:Inter,sans-serif;color:#000}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</helmet>
<div style="width: 1330px; height: 960px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 20px; background: #ecebe7">
  <div style="display: flex; align-items: baseline; gap: 14px">
    <span style="font: 700 34px/1 Doto, monospace">Icons</span>
    <span style="font: 300 13px Inter">v_icons · 1.5 px round-cap line on a 24 px grid · selected tab draws at 2 px in paper ink inside the ink pill</span>
  </div>
  <div style="display: flex; gap: 20px; flex: 1">
    <sc-for list="{{ inks }}" as="k" hint-placeholder-count="2">
      <div style="flex: 1; border-radius: 28px; background: {{ k.bg }}; color: {{ k.ink }}; padding: 24px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; align-content: start">
        <sc-for list="{{ icons }}" as="i" hint-placeholder-count="48">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0; border: 1px solid {{ k.ink }}; border-radius: 14px">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ i.d }}"></path></svg>
            <span style="font: 400 11px Inter">{{ i.n }}</span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
